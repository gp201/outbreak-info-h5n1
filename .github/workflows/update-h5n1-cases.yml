name: Update H5N1 case data

# Every 6 hours, Claude Code updates src/assets/data/h5n1_us_cases.json and, if the number of cases changed,
# opens a pull request with the new data. Needs the CLAUDE_CODE_OAUTH_TOKEN secret.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:

jobs:
  update:
    if: github.repository == 'outbreak-info/outbreak-info-h5n1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: src/assets/data
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # only the pull request step gets a GitHub token

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch case data
        run: ./fetch_h5n1_cases.sh

      - name: Open a pull request if the number of cases changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          claude -p "Compare the number of cases in h5n1_us_cases.json with the last committed version \
          (git show HEAD:./h5n1_us_cases.json): the confirmed and unconfirmed totals for humans, cattle and poultry. \
          If none of them changed, stop without doing anything. Otherwise create a branch named h5n1-cases-$(date +%Y-%m-%d-%H), \
          commit only h5n1_us_cases.json, push the branch, and open a pull request into main with gh pr create. \
          In the description, list each total before and after." \
            --model opus \
            --permission-mode auto \
            --allowedTools "Bash(git *)" "Bash(gh pr create *)" \
            --no-session-persistence
